[project]
name = "domovoy"
version = "0.2.0"
description = "Domovoy: a proactive personal assistant on Claude Code (wake-ups, journal in git, Obsidian diary)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "python-dotenv>=1.0",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["domovoy", "domovoy.immich"]

[tool.setuptools.package-data]
domovoy = ["*.md", "locales/*.json"]
